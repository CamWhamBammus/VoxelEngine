name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Install build and graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libglfw3-dev libglew-dev libglm-dev libgl1-mesa-dev libgl1-mesa-dri xvfb xauth

      - name: Configure viewer and tests
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build viewer and tests
        run: cmake --build build --parallel 2

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Run graphics smoke test with software rendering
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a ./build/VoxelEngine --smoke-test
          xvfb-run -a ./build/VoxelEngine --seed 4294967295 --screenshot build/terrain.ppm

      - name: Configure core without graphics dependencies
        run: cmake -S . -B build-core -DVOXEL_BUILD_APP=OFF -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build and test core
        run: |
          cmake --build build-core --parallel 2
          ctest --test-dir build-core --output-on-failure

      - name: Check memory and undefined behavior
        if: matrix.build_type == 'Debug'
        run: |
          cmake -S . -B build-sanitize -DVOXEL_BUILD_APP=OFF -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-sanitize --parallel 2
          ctest --test-dir build-sanitize --output-on-failure
